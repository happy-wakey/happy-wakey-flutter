name: Application state formal methods

on:
  pull_request:
    paths:
      - '.github/workflows/formal-methods.yml'
      - 'formal/**'
      - 'lib/src/core/app_state.dart'
      - 'lib/src/core/app_controller.dart'
      - 'lib/src/services/bluetooth_service.dart'
      - 'test/core/app_state_test.dart'
      - 'test/services/bluetooth_service_test.dart'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-methods.yml'
      - 'formal/**'
      - 'lib/src/core/app_state.dart'
      - 'lib/src/core/app_controller.dart'
      - 'lib/src/services/bluetooth_service.dart'
      - 'test/core/app_state_test.dart'
      - 'test/services/bluetooth_service_test.dart'
  schedule:
    - cron: '23 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happy-wakey-flutter-formal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'
  QUINT_PACKAGE: '@informalsystems/quint@0.32.0'

jobs:
  app-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install Java 21 for Apalache
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Test the production transition kernel
        run: |
          flutter pub get
          flutter test test/core/app_state_test.dart

      - name: Typecheck model and deterministic traces
        run: |
          set -euo pipefail
          npx --yes --package="$QUINT_PACKAGE" quint typecheck formal/app_state.qnt
          npx --yes --package="$QUINT_PACKAGE" quint typecheck formal/app_state_test.qnt
          npx --yes --package="$QUINT_PACKAGE" quint test \
            formal/app_state_test.qnt \
            --main=app_state_test \
            --match='.*Test$'

      - name: Explore 10,000 invariant-checked traces
        run: |
          set -euo pipefail
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/app_state.qnt \
            --main=app_state \
            --max-samples=10000 \
            --max-steps=24 \
            --invariant=app_state_safety \
            --witnesses \
              booting_reached \
              ready_reached \
              signed_out_reached \
              authenticating_reached \
              signed_in_reached \
              auth_failed_reached \
              lane_idle_reached \
              lane_running_reached \
              lane_ready_reached \
              lane_failed_reached \
              onboarding_complete_reached

      - name: Exhaustively check the bounded transition system
        run: |
          set -euo pipefail
          mkdir -p .formal-artifacts
          npx --yes --package="$QUINT_PACKAGE" quint verify \
            formal/app_state.qnt \
            --main=app_state \
            --max-steps=4 \
            --invariant=app_state_safety \
            --out-itf='.formal-artifacts/counterexample.itf.json'

      - name: Record exact verification inputs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .formal-artifacts
          sha256sum \
            formal/app_state.qnt \
            formal/app_state_test.qnt \
            lib/src/core/app_state.dart \
            lib/src/core/app_controller.dart \
            lib/src/services/bluetooth_service.dart \
            test/core/app_state_test.dart \
            test/services/bluetooth_service_test.dart \
            > .formal-artifacts/provenance.sha256

      - name: Upload proof provenance or counterexample
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: happy-wakey-flutter-formal-${{ github.sha }}
          path: .formal-artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
