name: Validate Flutter platforms

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happy-wakey-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  dart:
    name: Analyze, test, and build web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Enforce formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Native Dart and widget tests
        run: flutter test --coverage
      - name: Compile web release
        run: flutter build web --release

  platform-builds:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: android
            command: flutter build apk --release
          - os: ubuntu-24.04
            target: linux
            command: flutter build linux --release
          - os: macos-15
            target: macos
            command: flutter build macos --release
          - os: macos-15
            target: ios
            command: flutter build ios --release --no-codesign
          - os: windows-2025
            target: windows
            command: flutter build windows --release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Compile native release
        run: ${{ matrix.command }}
